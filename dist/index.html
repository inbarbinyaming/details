E · OPPORTUNITY TO IMPROVE' :'PERFORMING WELL · ABOVE STORE AVERAGE'}</span></div><div class="v16-alert-body"><h4>${heading}</h4><p class="v16-issue-line">${explanation}</p><div class="v16-gap"><strong>${low?'↓ '+gap:ready?'14 days':observed?'⌛':'✓'}</strong><span>${low?'fewer purchases per 100 product views than the store average':ready?'observation complete — data needed':observed?'collecting shoppers’ responses' :'Higher purchase rate than the store average'}</span></div><div class="v16-rate-row"><div><small>THIS PRODUCT · PURCHASE RATE</small><b>${p.rate.toFixed(1)}%</b></div><em>VS</em><div><small>YOUR STORE AVERAGE</small><b>${storeAvg().toFixed(1)}%</b></div></div><div class="v16-next"><b>WHAT TO DO NEXT →</b> ${next}</div></div></section>`}

function parseCSV(text){let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('An unclosed quotation mark was found. Check the CSV formatting.');row.push(cell.trim());if(row.some(Boolean))rows.push(row);return rows}
function validateCSV(text,kind){let rows=parseCSV(text),errors=[],warnings=[];if(!rows.length)throw Error('This CSV is empty. Export a report with column headers and data.');let head=rows.shift().map(x=>x.replace(/^\uFEFF/,'').toLowerCase().trim());if(head.length<2)errors.push('Only one column detected. Export a comma-separated CSV (not a tab/semicolon file).');let required=kind===0?[['handle','title']]:kind===1?[['name','order id','order number'],['lineitem name','line item name','lineitem sku','sku']]:[['product','product title','product name','product id','handle'],['views','product views','sessions','sessions with product views','visitors']];required.forEach(choices=>{if(!choices.some(c=>head.includes(c)))errors.push('Missing a required column: '+choices.join(' / ')+'.')});if(!rows.length)errors.push('No product or order rows found.');let expected=head.length,blank=0,invalid=0,duplicate=0,seen=new Set();rows.forEach((row,i)=>{if(row.length!==expected&&invalid++<3)errors.push(`Row ${i+2} has ${row.length} cells; expected ${expected}.`);if(row.every(v=>!v))blank++;if(kind===0){let ix=head.indexOf('handle'),key=ix>=0?row[ix]:null;if(key&&seen.has(key))duplicate++;if(key)seen.add(key)}if(kind===2){let vix=head.findIndex(v=>['views','product views','sessions','sessions with product views','visitors'].includes(v));if(vix>=0&&row[vix]&&!Number.isFinite(Number(row[vix].replace(/,/g,'')))&&invalid++<3)errors.push(`Row ${i+2}: view count must be numeric.`)}});if(blank)warnings.push(blank+' blank rows found.');if(duplicate)warnings.push(duplicate+' repeated product handles — Shopify may use multiple rows per product variant.');let dateCols=head.filter(x=>/date|created at|day/.test(x));if(!dateCols.length&&kind!==0)warnings.push('No date column detected. A 14-day before/after comparison cannot be verified from this file alone.');if(rows.length>50000)warnings.push('Large file: displaying validation summary for '+rows.length+' rows.');return {rows:rows.length,columns:head.length,errors,warnings,headers:head}}
function validationHTML(v,name){if(!v)return '';let ok=!v.errors.length;return `<div class="csv-validation ${ok?'passed':'failed'}" role="status"><b>${ok?'✓ File structure checked':'⚠ Fix before continuing'} · ${esc(name)}</b><small>${v.rows??v.data?.length??0} rows · ${Array.isArray(v.columns)?v.columns.length:v.columns||0} columns · ${v.errors.length} errors · ${v.warnings.length} warnings</small>${v.errors.concat(v.warnings).slice(0,7).map(s=>`<p>• ${esc(s)}</p>`).join('')}${ok?'<small>Parsed locally. When all three reports are uploaded, the data powers your analysis.</small>':''}</div>`}
async function validateSelectedFile(file,kind){if(!file)return null;if(!/\.csv$/i.test(file.name))throw Error('Choose a .csv file.');if(file.size>10*1024*1024)throw Error('File is over 10 MB. Export a smaller reporting period.');if(file.size===0)throw Error('File is empty.');return DetailsEngine.validate(await file.text(),['products','orders','views'][kind])}
async function handleUpload(e,i){let file=e.target.files[0];if(!file)return;let area=e.target.closest('.drop'),status=area.querySelector('.status'),next=$('#importNext');status.textContent='Parsing and validating report…';if(next&&i<2)next.disabled=true;try{let result=await validateSelectedFile(file,i);area.querySelector('.csv-validation')?.remove();area.insertAdjacentHTML('beforeend',validationHTML(result,file.name));if(result.errors.length){status.textContent='⚠ File not accepted';delete state.uploads[i];delete state.importRecords[['products','orders','views'][i]]}else{state.uploads[i]=file.name;state.importRecords[['products','orders','views'][i]]=result;status.textContent='✓ Data parsed and ready';if(next)next.disabled=false;if(Object.keys(state.importRecords).length===3){let report=DetailsEngine.buildReport(state.importRecords);activateReport(report);navigate('overview');return}}persist()}catch(err){status.textContent='⚠ '+err.message;delete state.uploads[i];persist()}}
function setSearch(v){state.search=v;let pos=document.activeElement?.selectionStart;render();let input=$('.toolbar input');input.focus();input.setSelectionRange(pos,pos)}
function setFilter(v){state.filter=v;state.metricFilter='';render()}
function setMetricCard(kind){state.filter=kind==='attention'?'Needs attention':kind==='stock'?'Low stock':kind==='observation'?'Under observation':'All';state.metricFilter='';state.stockFilter='All';state.search='';render()}
function dismissProduct(id){state.dismissed[id]=new Date().toISOString();persist();render()}
function dismissProductAndReturn(id){state.dismissed[id]=new Date().toISOString();state.filter='All';persist();navigate('overview')}
function restoreProduct(id){delete state.dismissed[id];persist();render()}
function setSort(v){state.sort=v;render()}
function setStockFilter(v){state.stockFilter=v;render()}
function toggleFilters(){state.filtersOpen=!state.filtersOpen;render()}
function clearFilters(){state.filter='All';state.metricFilter='';state.stockFilter='All';state.sort='Most orders';state.search='';render()}
function selectProduct(id){state.product=id;render()}
function setImplementationStep(i){state.implementationStep=Math.max(0,Math.min(ideaContext(product(),state.idea).steps.length-1,i));render()}
function finishImplementationStep(){state.implementationDone[state.implementationStep]=true;if(state.implementationStep<ideaContext(product(),state.idea).steps.length-1)state.implementationStep++;render()}
function setReview(id,v){state.selection[id]=v;persist()}
function markComplete(){saveAction('Completed')}
function markPlanned(){saveAction('Planned')}
function saveAction(status){let selectedDate=$('#completedDate')?.value;state.actions=state.actions.filter(a=>!(a.product===state.product&&a.idea===state.idea));state.actions.unshift({product:state.product,idea:state.idea,status,date:status===COMPLETED?(selectedDate||new Date().toISOString().slice(0,10)):null,baselineRate:product().rate});persist();navigate('tracker')}
function openTracked(i){state.viewWindow=i;navigate('tracked')}
function toggleMobile(force){let el=$('#mobileNav');el.style.display=force===false?'none':el.style.display==='none'?'block':'none'}
async function followupFile(e,i){let f=e.target.files[0];if(!f)return;let status=$('#after'+i),area=e.target.closest('.drop');status.textContent='Parsing new report…';try{let v=await validateSelectedFile(f,i===0?1:2);area.querySelector('.csv-validation')?.remove();area.insertAdjacentHTML('beforeend',validationHTML(v,f.name));if(v.errors.length){status.textContent='⚠ File not accepted';return}state.uploads['after'+i]=f.name;state.followupRecords[i===0?'orders':'views']=v;status.textContent='✓ Report parsed';if(state.followupRecords.orders&&state.followupRecords.views){let processed=0;for(const a of state.actions.filter(x=>x.status===COMPLETED&&testProgress(x).ready)){let p=PRODUCTS.find(x=>x.id===a.product);if(!p)continue;let result=DetailsEngine.evaluateWindow({...p,rate:a.baselineRate??p.rate},state.followupRecords.orders,state.followupRecords.views,a.date);state.followupResults[a.product]=result;if(result.ready)processed++}persist();status.textContent=processed?'✓ Analyzed '+processed+' completed experiment(s)':'✓ Reports loaded · No eligible complete results';navigate('tracker');return}persist()}catch(err){status.textContent='⚠ '+err.message}}
window.addEventListener('hashchange',()=>{let hash=location.hash.slice(1).split('-')[0];if(hash&&hash!==state.page&&['home','how','import','overview','product','ideas','plan','execute','tracker','tracked','reimport'].includes(hash)){state.page=hash;render()}});
let initial=location.hash.slice(1).split('-');if(['home','how','import','overview','product','ideas','plan','execute','tracker','tracked','reimport'].includes(initial[0]))state.page=initial[0];if(initial[0]==='import'&&initial[1])state.step=Math.min(2,Math.max(0,Number(initial[1])||0));render();
</script>
</body></html>
